[project]
name = "ledgerly"
version = "1.14.0"
description = "Ledgerly charges service: API, worker and migrations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.118",
    "httpx>=0.28",
    "prometheus-client>=0.23",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.10",
    "redis>=6.4",
    "uvicorn[standard]>=0.37",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`:DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "standard"
