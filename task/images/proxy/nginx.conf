# Round-robin load balancer in front of the two API replicas.
upstream ledgerly_api {
    server api1:8000 max_fails=0;
    server api2:8000 max_fails=0;
    keepalive 64;
}

server {
    listen 8080;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://ledgerly_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }
}
